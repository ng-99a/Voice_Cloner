[project]
name = "cloner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.14.0",
    "chatterbox-tts>=0.1.7",
    "langchain>=1.3.16",
    "langchain-core>=1.6.0",
    "langchain-ollama>=1.1.0",
    "resemble-perth>=1.0.1",
    "setuptools<81",
    "transformers>=5.2.0",
]

[project.scripts]
cloner = "cloner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
